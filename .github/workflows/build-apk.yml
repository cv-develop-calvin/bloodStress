name: Build Android APK

# 本机没有 Linux/WSL 时，用 GitHub Actions 免费构建 APK：
# 1) 把本项目推送到 GitHub 仓库
# 2) Actions 页面选中本工作流 → Run workflow（务必选 main 分支）
# 3) 完成后下载 Artifacts 里的 apk，传到手机安装

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            zip unzip git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      - name: Cache buildozer directories
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Preflight check
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          buildozer version

      - name: Build debug APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tail -n 400

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-logs
          path: .buildozer/**/*.log
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blood-pressure-apk
          path: bin/*.apk
          if-no-files-found: warn
