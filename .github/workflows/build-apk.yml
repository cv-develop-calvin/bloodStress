name: Build Android APK

# 构建方式：
# 1) 推送到 main 分支自动触发（打 vX.Y.Z 标签会自动创建 Release 并附上 APK）
# 2) 也可在 Actions 页面选中本工作流 → Run workflow（分支选 main）

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write      # 打标签构建时需要创建 Release

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            zip unzip git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      # 版本号以 version.py 为唯一来源，避免和 buildozer.spec 不一致
      - name: Sync version and write build info
        id: ver
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime

          text = open('version.py', encoding='utf-8').read()
          version = re.search(r'VERSION\s*=\s*"([^"]+)"', text).group(1)
          parts = [int(x) for x in re.findall(r'\d+', version)[:3]]
          while len(parts) < 3:
              parts.append(0)
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]

          spec = open('buildozer.spec', encoding='utf-8').read()
          spec_new = re.sub(r'^version\s*=.*$', f'version = {version}', spec, count=1, flags=re.M)
          if spec_new != spec:
              open('buildozer.spec', 'w', encoding='utf-8').write(spec_new)

          sha = subprocess.run(['git', 'rev-parse', '--short', 'HEAD'],
                               capture_output=True, text=True).stdout.strip()
          branch = subprocess.run(['git', 'rev-parse', '--abbrev-ref', 'HEAD'],
                                  capture_output=True, text=True).stdout.strip()
          info = {
              'version': version,
              'version_code': code,
              'build_time': datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),
              'commit': sha,
              'branch': branch,
              'run_number': os.environ.get('GITHUB_RUN_NUMBER', '—'),
              'build_type': 'release' if branch.startswith('v') or os.environ.get('GITHUB_REF', '').startswith('refs/tags/') else 'dev',
              'repo': os.environ.get('GITHUB_REPOSITORY', ''),
          }
          json.dump(info, open('build_info.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('版本:', version, 'code =', code)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\ncode={code}\n')
          PY

      - name: Cache Android SDK/NDK
        uses: actions/cache@v6
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-sdk-

      - name: Clean previous dist (force icon refresh)
        run: |
          rm -rf .buildozer/android/platform/build/dists
          rm -rf .buildozer/android/platform/build/build
          ls -la static/img

      - name: Preflight check
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ls -la build_info.json
          buildozer version

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          # 注意：不能用 `set -o pipefail` + `yes |`，yes 被 SIGPIPE 杀掉会造成构建成功却误报失败。
          # 这里只取 buildozer 自己的退出码（PIPESTATUS[1]）。
          yes '' | buildozer -v android debug 2>&1 | tail -n 400
          exit "${PIPESTATUS[1]}"

      - name: Verify APK resources
        if: always()
        run: |
          ls -la bin || true
          AAPT=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/aapt2 2>/dev/null | tail -n 1)
          echo "aapt2: $AAPT"
          for f in bin/*.apk; do
            [ -e "$f" ] || continue
            echo "===== badging $f ====="
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$f" | grep -E "application-icon|roundIcon|label=|package: name|versionName|versionCode" || true
            fi
            echo "===== APK 内容抽查（$f）====="
            # p4a 会把应用代码编译成 .pyc 并把整个私有目录打进 assets/private.tar，
            # 第三方纯 Python 依赖则在 libpybundle.so 里，所以必须分别检查。
            python3 - "$f" <<'PY'
          import io, sys, tarfile, zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()

              # 1) 私有目录内的应用文件
              tar_names = []
              blob = z.read("assets/private.tar") if "assets/private.tar" in names else b""
              if blob:
                  with tarfile.open(fileobj=io.BytesIO(blob)) as t:
                      tar_names = t.getnames()
              # python3 recipe 产出 .pyc，兼容 .py 便于本地排查
              py = lambda stem: any(n.endswith(stem + ".pyc") or n.endswith(stem + ".py")
                                    for n in tar_names)
              res = lambda name: any(n.endswith(name) for n in tar_names)

              checks = {
                  "应用入口 main": py("main"),
                  "血压模块 app": py("app"),
                  "笔记本模块 photos": py("photos"),
                  "数据层 storage": py("storage"),
                  "血常规 lab": py("lab"),
                  "主题背景 bg-saint.jpg": res("bg-saint.jpg"),
                  "横幅 bg-saint-top.jpg": res("bg-saint-top.jpg"),
                  "应用图标 icon-512.png": res("icon-512.png"),
                  "模板 base.html": res("templates/base.html"),
                  "模板 notes.html": res("templates/notes.html"),
                  "Chart.js": res("chart.umd.min.js"),
                  "Bootstrap": res("bootstrap.min.css"),
                  # 2) 依赖库：p4a 把纯 Python 依赖打进 libpybundle.so
                  "依赖包 bundle (libpybundle.so)": any(
                      n.endswith("libpybundle.so") for n in names),
                  "私有目录 assets/private.tar": bool(blob),
              }

              missing = []
              for label, ok in checks.items():
                  print(("  OK   " if ok else "  MISS ") + label)
                  if not ok:
                      missing.append(label)

              # Flask / Pillow / markupsafe 是否真的可用：检查 .so 内是否含关键字
              bundle_hit = {}
              if any(n.endswith("libpybundle.so") for n in names):
                  data = z.read([n for n in names if n.endswith("libpybundle.so")][0])
                  for lib, keys in {
                      "Flask": [b"flask/", b"flask\\", b"flask/__init__"],
                      "Werkzeug": [b"werkzeug"],
                      "Jinja2": [b"jinja2"],
                      "markupsafe": [b"markupsafe"],
                      "Pillow(PIL)": [b"PIL/", b"PIL\\", b"PIL/Image"],
                  }.items():
                      hit = any(k in data for k in keys)
                      bundle_hit[lib] = hit
                      print(("  OK   " if hit else "  MISS ") + f"{lib}（bundle 内）")
                      if not hit:
                          missing.append(lib)

              print(f"  私有目录文件数: {len(tar_names)}")
              print(f"  Python 版本库: "
                    + str([n for n in names if "libpython" in n]))

              if missing:
                  print("::error::APK 缺少关键内容，装上会闪退: " + ", ".join(missing))
                  sys.exit(1)
          PY
          done

      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::buildozer 构建失败，详见上方 Build debug APK 日志"
          exit 1

      - name: Diagnostics on failure
        if: failure() || steps.build.outcome == 'failure'
        run: |
          echo "===== bin 目录 ====="
          ls -la bin || true
          echo "===== buildozer 日志尾部 ====="
          find .buildozer -maxdepth 4 -name "*.log" -printf "%p\n" 2>/dev/null | head -n 5
          find .buildozer -maxdepth 4 -name "*.log" -exec sh -c 'echo "--- $1"; tail -n 60 "$1"' _ {} \; 2>/dev/null | head -n 400

      - name: Upload build logs on failure
        if: failure() || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-logs
          path: .buildozer/**/*.log
          if-no-files-found: ignore

      # APK 重命名带上版本号，方便区分与留档
      - name: Rename APK with version
        if: always()
        run: |
          mkdir -p dist
          for f in bin/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/songbaobao-v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.code }}-debug.apk"
          done
          ls -la dist || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blood-pressure-apk-v${{ steps.ver.outputs.version }}
          path: dist/*.apk
          if-no-files-found: warn

      # 每次构建都发 Release：Release 的 assets 是原始 APK 文件，
      # 手机浏览器点开即可直接下载安装，不像 Artifacts 那样打包成 zip。
      # 打 vX.Y.Z 标签时使用标签号作为版本，否则用「构建号」生成滚动版本。
      - name: Publish APK release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('v{0}', steps.ver.outputs.version) || format('构建 {0} · v{1}', github.run_number, steps.ver.outputs.version) }}
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 宋宝宝的记录 v${{ steps.ver.outputs.version }}

            **直链 APK，手机点开即可下载安装。**

            - 构建号 `${{ steps.ver.outputs.version_code }}`
            - 提交 `${{ github.sha }}`
            - 构建时间 ${{ github.event.repository.updated_at }}

            安装提示：手机首次安装需在弹窗里允许「未知来源应用」。
            升级安装不会丢失历史数据（数据库在应用私有目录）。

