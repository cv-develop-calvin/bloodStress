name: Build Android APK

# 本机没有 Linux/WSL 时，用 GitHub Actions 免费构建 APK：
# 1) 把本项目推送到 GitHub 仓库
# 2) Actions 页面选中本工作流 → Run workflow
# 3) 完成后下载 Artifacts 里的 apk，传到手机安装

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev unzip zip

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blood-pressure-apk
          path: bin/*.apk
