name: Build Android APK

# 本机没有 Linux/WSL 时，用 GitHub Actions 免费构建 APK：
# 1) 把本项目推送到 GitHub 仓库
# 2) Actions 页面选中本工作流 → Run workflow
# 3) 完成后下载 Artifacts 里的 apk，传到手机安装

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            zip unzip git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer -v android debug 2>&1 | tail -n 200

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blood-pressure-apk
          path: bin/*.apk
          if-no-files-found: warn
