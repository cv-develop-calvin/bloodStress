name: Build Android APK

# 本机没有 Android SDK，用 GitHub Actions 免费构建 APK。
# 构建完成后到 Releases 页面下载 APK 装到手机。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI 在境外，走官方 Maven 仓库比阿里云快
      USE_MIRROR: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # wrapper 里配的是腾讯云镜像（服务本机），CI 改用官方分发
      - name: Use official Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          # 保存完整日志，并用 PIPESTATUS 取 gradle 真实退出码。
          # --no-daemon：CI 上出现 Kotlin 编译守护进程崩溃，禁用更稳定。
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # 把真实编译错误输出为 GitHub 注解。
      # 这样无需登录也能通过 annotations API 读取错误，便于快速定位。
      - name: Surface compile errors
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-build
          cp build.log ci-build/full-build.log
          echo "::group::构建错误详情"
          {
            # 1) Kotlin 源码编译错误是根因，优先完整抓取
            echo "==== Kotlin 源码错误 ===="
            grep -E '^e: file:///' build.log | head -n 200
            # 2) 任何以 e: 开头的编译器错误（含 kapt/KSP 阶段）
            echo "==== 所有 e: 错误 ===="
            grep -E '^e: ' build.log | head -n 60
            # 3) 依赖 / 任务级错误
            echo "==== 依赖与任务错误 ===="
            grep -E 'error: |Unresolved|Could not resolve|Could not find|Could not determine|Execution failed|BUILD FAILED|Could not load module' build.log | head -n 60
            # 4) Gradle 的具体原因在 What went wrong 之后若干行
            echo "==== What went wrong 详情 ===="
            grep -A 30 'What went wrong' build.log | head -n 60
            # 5) 兜底：原始日志尾部，避免遗漏未匹配到的错误
            echo "==== 日志尾部 ===="
            tail -n 120 build.log
          } | tee ci-build/errors.log | while IFS= read -r line; do
              # GitHub 注解消息需转义特殊字符
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::$esc"
            done
          echo "::endgroup::"

      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::构建失败，具体编译错误见上方注解"
          exit 1

      # 把错误日志作为公开 Release 资源上传（对公开仓库可匿名下载），
      # 这样无需登录也能读到真实编译错误，便于快速定位。
      - name: Upload build errors as release asset
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-log
          name: CI 构建错误日志
          files: |
            ci-build/errors.log
            ci-build/full-build.log
          draft: false
          prerelease: true

      - name: Rename APK with build number
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/songbaobao-v1.2.0-build${{ github.run_number }}.apk"
          done
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: dist/*.apk
          if-no-files-found: warn

      # Release 的 assets 是原始 APK 文件（不是 zip），手机浏览器点开即可下载安装
      - name: Publish APK release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 宋宝宝的记录 · 构建 ${{ github.run_number }}
          files: dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 宋宝宝的记录 v1.2.0

            **点击下方的 APK 文件即可下载安装**（原始文件，非压缩包）。

            - 构建号 `${{ github.run_number }}`
            - 提交 `${{ github.sha }}`
            - 最低要求 Android 8.0（API 26）

            安装时手机会提示「未知来源应用」，允许即可。
            数据保存在手机本地，卸载会一并删除。
