name: Build Android APK

# 构建方式：
# 1) 推送到 main 分支会自动触发本工作流
# 2) 也可在 Actions 页面选中本工作流 → Run workflow（分支选 main）
# 3) 完成后下载 Artifacts 里的 apk，传到手机安装

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            zip unzip git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      - name: Cache buildozer directories
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Preflight check
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          buildozer version

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          # 注意：不能用 `set -o pipefail` + `yes |`，yes 被 SIGPIPE 杀掉会造成构建成功却误报失败。
          # 这里只取 buildozer 自己的退出码（PIPESTATUS[1]）。
          yes '' | buildozer -v android debug 2>&1 | tail -n 400
          exit "${PIPESTATUS[1]}"

      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::buildozer 构建失败，详见上方 Build debug APK 日志"
          exit 1

      - name: Diagnostics on failure
        if: failure() || steps.build.outcome == 'failure'
        run: |
          echo "===== bin 目录 ====="
          ls -la bin || true
          echo "===== buildozer 日志尾部 ====="
          find .buildozer -maxdepth 4 -name "*.log" -printf "%p\n" 2>/dev/null | head -n 5
          find .buildozer -maxdepth 4 -name "*.log" -exec sh -c 'echo "--- $1"; tail -n 60 "$1"' _ {} \; 2>/dev/null | head -n 400

      - name: Upload build logs on failure
        if: failure() || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: buildozer-logs
          path: .buildozer/**/*.log
          if-no-files-found: ignore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blood-pressure-apk
          path: bin/*.apk
          if-no-files-found: warn
