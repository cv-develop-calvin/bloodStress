# Compose 编译较耗内存，同时给 kapt/Kotlin 编译留余量。
# JDK 17 的模块系统封闭了 jdk.compiler 内部包，kapt 的存根生成阶段需要访问它们，
# 未开放会直接报 "e: Could not load module <Error module>"。
# 注意：gradle.properties 不支持反斜杠续行，必须写成单行。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 增量编译，加快二次构建
kotlin.incremental=true
# kapt 需要独立的 Kotlin 编译守护进程来加载注解处理器。
# 不要设为 in-process —— kapt 在 in-process 模式下类加载器隔离不完整，
# 同样会报 "e: Could not load module <Error module>"。
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
