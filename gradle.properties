# Compose 编译较耗内存，但 CI 需给 Kotlin 编译进程留余量，故控制在 3G
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 增量编译，加快二次构建
kotlin.incremental=true
# kapt 需要独立的 Kotlin 编译守护进程来加载注解处理器。
# 注意：不要设为 in-process —— kapt 在 in-process 模式下类加载器隔离不完整，
# 会直接报 "e: Could not load module <Error module>"。
# 内存受限导致的 daemon 崩溃改用较小的 jvmargs 缓解。
kotlin.compiler.execution.strategy=daemon

# JDK 17 模块系统默认封闭编译器内部包，kapt 注解处理需要这些包，
# 未开放时会报 "e: Could not load module <Error module>"。
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
