# Compose 编译较耗内存，但 CI 需给 Kotlin 编译进程留余量，故控制在 3G
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 增量编译，加快二次构建
kotlin.incremental=true
# 在 Gradle 进程内编译，避免独立的 Kotlin 编译守护进程崩溃
# （CI 上出现过 daemon has terminated unexpectedly，导致符号解析为 error.NonExistentClass）
kotlin.compiler.execution.strategy=in-process
