# Compose 编译较耗内存，但 CI 需给 Kotlin 编译进程留余量，故控制在 3G
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 增量编译，加快二次构建
kotlin.incremental=true
# kapt 需要独立的 Kotlin 编译守护进程来加载注解处理器。
# 注意：不要设为 in-process —— kapt 在 in-process 模式下类加载器隔离不完整，
# 会直接报 "e: Could not load module <Error module>"。
# 内存受限导致的 daemon 崩溃改用较小的 jvmargs 缓解。
kotlin.compiler.execution.strategy=daemon

# 让 kapt / Kotlin 打印具体错误位置与堆栈，便于定位
kapt.include.compile.classpath=true
kapt.showProcessorClasspath=true
kotlin.kapt.verbose=true
