# Compose + KSP 编译较耗内存。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Kotlin 增量编译，加快二次构建
kotlin.incremental=true
# 关闭 KSP2，使用 KSP1。KSP2 在 Kotlin 1.9.x 下多注解处理器（Hilt + Room）
# 的执行顺序不稳定，会导致 Hilt 在 Room 生成 DAO/Database 前分析，
# 报 "error.NonExistentClass"（provideBpDao(error.NonExistentClass)）。
ksp.useKSP2=false
