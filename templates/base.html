<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <title>{% block title %}宋宝宝的记录{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="bg-body-tertiary">

<nav class="navbar bg-primary navbar-dark sticky-top shadow-sm">
  <div class="container">
    <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 20.7l-1.5-1.35C5.1 14.4 2 11.6 2 8.2 2 5.4 4.2 3.2 7 3.2c1.6 0 3.1.7 4.1 1.9 1-1.2 2.5-1.9 4.1-1.9 2.8 0 5 2.2 5 5 0 3.4-3.1 6.2-8.5 11.15L12 20.7z"/>
      </svg>
      宋宝宝的记录
    </span>
    <a class="btn btn-light btn-sm fw-semibold" href="{{ url_for('add') }}">＋ 记录</a>
  </div>
</nav>

<main class="container py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<nav class="tabbar bg-white border-top d-lg-none">
  <div class="container-fluid px-0">
    <div class="row g-0 text-center">
      <a class="col tabbar-item {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
        <span>📈</span><small>趋势</small>
      </a>
      <a class="col tabbar-item {% if request.endpoint == 'add' %}active{% endif %}" href="{{ url_for('add') }}">
        <span>➕</span><small>添加</small>
      </a>
      <a class="col tabbar-item {% if request.endpoint == 'records' %}active{% endif %}" href="{{ url_for('records') }}">
        <span>📋</span><small>记录</small>
      </a>
    </div>
  </div>
</nav>

{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
