{% extends "base.html" %}
{% block title %}{{ title }} · 宋宝宝的记录{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mb-4">
  <div class="card-header bg-white"><h6 class="mb-0 fw-bold">{{ title }}</h6></div>
  <div class="card-body">
    <form method="post" action="{{ action }}" id="medForm">
      <div class="row g-3">
        <div class="col-12">
          <label for="name" class="form-label">药品名称</label>
          <input type="text" class="form-control" id="name" name="name" required
                 value="{{ med['name'] }}" placeholder="如：氨氯地平片">
        </div>

        <div class="col-6">
          <label for="dosage" class="form-label">每次剂量</label>
          <input type="text" class="form-control" id="dosage" name="dosage"
                 value="{{ med['dosage'] }}" placeholder="5">
        </div>
        <div class="col-6">
          <label for="unit" class="form-label">单位</label>
          <select class="form-select" id="unit" name="unit">
            {% for u in ['mg', 'g', 'ml', '片', '粒', '袋', '支', '喷', 'IU'] %}
              <option value="{{ u }}" {% if med['unit'] == u %}selected{% endif %}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12">
          <label for="freq" class="form-label">服用频次</label>
          <select class="form-select" id="freq" name="freq">
            {% for f in freqs %}
              <option value="{{ f }}" {% if med['freq'] == f %}selected{% endif %}>{{ f }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-12">
          <label class="form-label d-flex justify-content-between align-items-center">
            <span>服药时间（到点提醒）</span>
            <button type="button" class="btn btn-sm btn-outline-primary" id="addTime">＋ 加一个时间</button>
          </label>
          <div id="timeList" class="d-flex flex-wrap gap-2"></div>
          <div class="form-text">可加多个时间，例如早 8 点、晚 8 点；按需服用时留空即可。</div>
        </div>

        <div class="col-6">
          <label for="start_date" class="form-label">开始日期</label>
          <input type="date" class="form-control" id="start_date" name="start_date"
                 value="{{ med['start_date'] }}">
        </div>
        <div class="col-6">
          <label for="end_date" class="form-label">结束日期（可空）</label>
          <input type="date" class="form-control" id="end_date" name="end_date" value="{{ med['end_date'] }}">
        </div>

        <div class="col-12">
          <label for="note" class="form-label">备注（可空）</label>
          <input type="text" class="form-control" id="note" name="note"
                 value="{{ med['note'] }}" placeholder="如：饭后服用、早晚各一次">
        </div>

        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="active" name="active"
                   {% if med['active'] %}checked{% endif %}>
            <label class="form-check-label" for="active">启用提醒</label>
          </div>
        </div>

        <div class="col-12 d-grid gap-2 d-sm-flex">
          <button type="submit" class="btn btn-primary px-4">保存</button>
          <a href="{{ url_for('meds') }}" class="btn btn-outline-secondary">取消</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.MED_TIMES = "{{ med['times'] }}";
</script>
<script src="{{ url_for('static', filename='js/med_form.js') }}"></script>
{% endblock %}
